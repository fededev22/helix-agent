<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demo Counter</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Demo Counter</h1>
      <p class="hint">A tiny sample app for Helix to read and fix.</p>
      <p id="count" aria-live="polite">0</p>
      <div class="row">
        <button id="dec" type="button">−</button>
        <button id="inc" type="button">+</button>
        <button id="reset" type="button">Reset</button>
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
